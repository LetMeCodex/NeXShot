  <!-- Multi-lane Relay Schedule Waterfall Tracks -->
  <g stroke="#0F172A" stroke-width="0.75" opacity="0.4">
    <!-- Timeline Axis -->
    <line x1="60" y1="60" x2="560" y2="60" stroke-width="1"/>
    <text x="60" y="52" font-family="monospace" font-size="9" fill="#0F172A" letter-spacing="1">08:00</text>
    <text x="185" y="52" font-family="monospace" font-size="9" fill="#0F172A" letter-spacing="1">10:00</text>
    <text x="310" y="52" font-family="monospace" font-size="9" fill="#0F172A" letter-spacing="1">12:00</text>
    <text x="435" y="52" font-family="monospace" font-size="9" fill="#0F172A" letter-spacing="1">14:00</text>
    <text x="540" y="52" font-family="monospace" font-size="9" fill="#0F172A" letter-spacing="1">16:00</text>
    
    <!-- Relay Time Track 1 -->
    <line x1="60" y1="85" x2="560" y2="85" stroke-dasharray="2 3"/>
    <rect x="70" y="73" width="105" height="22" rx="4" fill="none" stroke="#0F172A" stroke-width="0.8"/>
    <text x="80" y="87" font-family="monospace" font-size="8" fill="#0F172A" font-weight="600">RELAY 01 · 10m PISTOL</text>
    <rect x="195" y="73" width="105" height="22" rx="4" fill="none" stroke="#E63946" stroke-width="1" opacity="0.8"/>
    <text x="205" y="87" font-family="monospace" font-size="8" fill="#E63946" font-weight="600">RELAY 02 · 10m RIFLE</text>

    <!-- Relay Time Track 2 -->
    <line x1="60" y1="120" x2="560" y2="120" stroke-dasharray="2 3"/>
    <rect x="320" y="108" width="105" height="22" rx="4" fill="none" stroke="#0F172A" stroke-width="0.8"/>
    <text x="330" y="122" font-family="monospace" font-size="8" fill="#0F172A" font-weight="600">RELAY 03 · 50m 3P</text>
    <rect x="445" y="108" width="100" height="22" rx="4" fill="none" stroke="#0F172A" stroke-width="0.8"/>
    <text x="455" y="122" font-family="monospace" font-size="8" fill="#0F172A" font-weight="600">RELAY 04 · FINALS</text>
  </g>

  <!-- WhatsApp Pulse Conduit / Radio Transmission Ripples -->
  <g transform="translate(480, 240)">
    <circle cx="0" cy="0" r="18" stroke="#E63946" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="0" r="38" stroke="#E63946" stroke-width="0.9" opacity="0.45" stroke-dasharray="3 3"/>
    <circle cx="0" cy="0" r="60" stroke="#0F172A" stroke-width="0.75" opacity="0.35"/>
    <circle cx="0" cy="0" r="85" stroke="#0F172A" stroke-width="0.6" opacity="0.25" stroke-dasharray="5 4"/>
    <circle cx="0" cy="0" r="115" stroke="#0F172A" stroke-width="0.5" opacity="0.18"/>
    <circle cx="0" cy="0" r="4" fill="#E63946" opacity="0.7"/>
    <!-- Radiation Spokes -->
    <line x1="-125" y1="0" x2="125" y2="0" stroke="#0F172A" stroke-width="0.5" opacity="0.25"/>
    <line x1="0" y1="-125" x2="0" y2="125" stroke="#0F172A" stroke-width="0.5" opacity="0.25"/>
    <!-- Degree Ticks -->
    <path d="M 0 -22 L 0 -18 M 22 0 L 18 0 M 0 22 L 0 18 M -22 0 L -18 0" stroke="#E63946" stroke-width="1" opacity="0.7"/>
  </g>

  <!-- Precision Chronometer Scale -->
  <g transform="translate(100, 270)">
    <circle cx="0" cy="0" r="50" stroke="#0F172A" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="0" r="44" stroke="#0F172A" stroke-width="0.5" opacity="0.2" stroke-dasharray="2 3"/>
    <!-- Compass Cross -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#0F172A" stroke-width="0.6" opacity="0.3"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#0F172A" stroke-width="0.6" opacity="0.3"/>
    <text x="0" y="4" font-family="monospace" font-size="8" fill="#0F172A" text-anchor="middle" opacity="0.5">00:00.0s</text>
  </g>

  <!-- Watermark Technical Typography & Registrations -->
  <g font-family="monospace" font-size="8" fill="#0F172A" opacity="0.45" letter-spacing="1.5">
    <text x="35" y="340">DISPATCH CONDUIT // AUTOMATED SQUAD MATRIX // CLASH-FREE PROTOCOL</text>
    <text x="470" y="340">SYNC: 100%</text>
    <!-- Corner Crosshairs -->
